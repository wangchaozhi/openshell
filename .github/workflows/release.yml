name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0. Leave empty to auto-bump the latest tag's patch (v0.5.1 -> v0.5.2)."
        required: false
        type: string
      prerelease:
        description: "Mark this GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  APP_NAME: OpenShell
  QT_VERSION: 6.10.0
  BUILD_TYPE: Release

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if [ "${EVENT_NAME}" = "push" ]; then
            tag="${REF_NAME}"
            echo "Using pushed tag: ${tag}"
          elif [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            # 选语义化 vX.Y.Z 的最新 tag 做基准；找不到就从 v0.0.0 起步。
            latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
            if [ -z "${latest}" ]; then
              latest="v0.0.0"
            fi
            stripped="${latest#v}"
            IFS='.' read -r major minor patch <<<"${stripped}"
            patch=$((patch + 1))
            tag="v${major}.${minor}.${patch}"
            echo "Latest tag: ${latest}, auto-bumped to: ${tag}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.asset_name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            aqt_host: windows
            qt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
            build_parallel: 4
            asset_name: OpenShell-windows-x64
          - os: macos-26
            aqt_host: mac
            qt_arch: clang_64
            qt_dir: macos
            cmake_extra_args: -DCMAKE_OSX_ARCHITECTURES=arm64 -DQT_QML_NO_CACHEGEN=ON
            build_parallel: 2
            asset_name: OpenShell-macos-arm64
          - os: ubuntu-22.04
            aqt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
            build_parallel: 4
            asset_name: OpenShell-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            desktop-file-utils \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libsecret-1-dev \
            patchelf \
            wget \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xkb1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate platform icons
        shell: bash
        run: python scripts/generate-platform-icons.py

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-v3-openshell-${{ runner.os }}-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}-${{ matrix.qt_dir }}

      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          extra_modules=()
          if [ "${{ runner.os }}" = "Linux" ]; then
            # qtwayland is useful for Wayland sessions, but not every Qt
            # release/arch publishes it as an aqt module. Treat it as optional
            # so the build is not blocked by package-index drift.
            available_modules="$(python -m aqt list-qt "${{ matrix.aqt_host }}" desktop --modules "${QT_VERSION}" "${{ matrix.qt_arch }}" || true)"
            if printf '%s\n' "${available_modules}" | grep -qx 'qtwayland'; then
              extra_modules=(--modules qtwayland)
            fi
          fi
          python -m aqt install-qt "${{ matrix.aqt_host }}" desktop "${QT_VERSION}" "${{ matrix.qt_arch }}" -O "${RUNNER_TEMP}/Qt" "${extra_modules[@]}"

      - name: Configure Qt environment
        shell: bash
        run: |
          qt_root="${RUNNER_TEMP}/Qt/${QT_VERSION}/${{ matrix.qt_dir }}"
          if [ ! -d "${qt_root}" ]; then
            echo "Qt root was not found: ${qt_root}" >&2
            exit 1
          fi
          echo "QT_ROOT=${qt_root}" >> "${GITHUB_ENV}"
          echo "CMAKE_PREFIX_PATH=${qt_root}" >> "${GITHUB_ENV}"
          echo "${qt_root}/bin" >> "${GITHUB_PATH}"

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"

      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" ${{ matrix.cmake_extra_args || '' }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel ${{ matrix.build_parallel }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $PWD "package"
          $deployDir = Join-Path $packageRoot "${{ matrix.asset_name }}"
          New-Item -ItemType Directory -Force -Path $deployDir | Out-Null

          $exe = Get-ChildItem -Path build -Recurse -Filter "${env:APP_NAME}.exe" | Select-Object -First 1
          if (-not $exe) { throw "Executable was not found." }

          Copy-Item $exe.FullName $deployDir
          Copy-Item README.md $deployDir
          Copy-Item docs $deployDir -Recurse
          Copy-Item assets $deployDir -Recurse
          windeployqt --release --qmldir "$PWD\qml" `
            --no-translations --no-system-d3d-compiler --no-opengl-sw --no-ffmpeg `
            "$deployDir\${env:APP_NAME}.exe"

          Compress-Archive -Path "$deployDir\*" -DestinationPath "$packageRoot\${{ matrix.asset_name }}.zip" -Force

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          app_path="$(find build -maxdepth 4 -name "${APP_NAME}.app" -print -quit)"
          if [ -z "${app_path}" ]; then
            echo "${APP_NAME}.app was not found." >&2
            exit 1
          fi

          macdeployqt "${app_path}" -qmldir="${PWD}/qml"
          rm -rf "${app_path}/Contents/PlugIns/sqldrivers"
          mkdir -p "${app_path}/Contents/Resources/assets"
          rsync -a --delete assets/ "${app_path}/Contents/Resources/assets/"
          codesign --force --deep --sign - "${app_path}"

          dmg_root="package/${{ matrix.asset_name }}"
          mkdir -p "${dmg_root}"
          cp -R "${app_path}" "${dmg_root}/"
          ln -s /Applications "${dmg_root}/Applications"
          cp README.md "${dmg_root}/"
          cp -R docs "${dmg_root}/"
          cp -R assets "${dmg_root}/"

          hdiutil create \
            -volname "OpenShell" \
            -srcfolder "${dmg_root}" \
            -ov \
            -format UDZO \
            "package/${{ matrix.asset_name }}.dmg"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package tools AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/doc/${APP_NAME}
          exe_path="$(find build -type f -name "${APP_NAME}" -executable -print -quit)"
          if [ -z "${exe_path}" ]; then
            echo "${APP_NAME} executable was not found." >&2
            exit 1
          fi

          cp "${exe_path}" "AppDir/usr/bin/${APP_NAME}"
          cp -R assets "AppDir/usr/bin/assets"
          cp assets/icons/openshell.svg "AppDir/usr/share/icons/hicolor/scalable/apps/OpenShell.svg"
          cp assets/icons/openshell.svg "AppDir/OpenShell.svg"
          cp README.md "AppDir/usr/share/doc/${APP_NAME}/"
          cp -R docs "AppDir/usr/share/doc/${APP_NAME}/"

          cat > "AppDir/usr/share/applications/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=OpenShell
          Comment=Cross-platform SSH/SFTP client
          Exec=OpenShell
          Icon=OpenShell
          Categories=Network;RemoteAccess;
          Terminal=false
          StartupNotify=true
          StartupWMClass=OpenShell
          X-AppImage-Name=OpenShell
          X-AppImage-Version=${{ needs.prepare.outputs.tag }}
          EOF

          cat > "tools/OpenShell.AppRun" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          appdir="${APPDIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"

          if [ -n "${APPIMAGE:-}" ] && [ -d "${HOME:-}" ]; then
            desktop_dir="${XDG_DATA_HOME:-$HOME/.local/share}/applications"
            icon_dir="${XDG_DATA_HOME:-$HOME/.local/share}/icons/hicolor/scalable/apps"
            mkdir -p "${desktop_dir}" "${icon_dir}"
            cp "${appdir}/usr/share/icons/hicolor/scalable/apps/OpenShell.svg" "${icon_dir}/OpenShell.svg"
            desktop_exec="${APPIMAGE//\\/\\\\}"
            desktop_exec="${desktop_exec//\"/\\\"}"
            cat > "${desktop_dir}/OpenShell.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=OpenShell
          Comment=Cross-platform SSH/SFTP client
          Exec="${desktop_exec}"
          Icon=OpenShell
          Categories=Network;RemoteAccess;
          Terminal=false
          StartupNotify=true
          StartupWMClass=OpenShell
          DESKTOP
            chmod +x "${desktop_dir}/OpenShell.desktop"
            if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database "${desktop_dir}" >/dev/null 2>&1 || true
            fi
            if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q "${XDG_DATA_HOME:-$HOME/.local/share}/icons/hicolor" >/dev/null 2>&1 || true
            fi
          fi

          exec "${appdir}/usr/bin/OpenShell" "$@"
          EOF
          chmod +x "tools/OpenShell.AppRun"

          wget -q -O tools/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O tools/linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools/linuxdeploy-x86_64.AppImage tools/linuxdeploy-plugin-qt-x86_64.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="${QT_ROOT}/bin/qmake"
          export VERSION="${{ needs.prepare.outputs.tag }}"
          export PATH="${PWD}/tools:${PATH}"
          # linuxdeploy-plugin-qt 用 qmlimportscanner 扫描这些路径下的 .qml，
          # 才会把 QtQuick / QtQuick.Controls / OpenShell 自家模块打进 AppImage。
          export QML_SOURCES_PATHS="${PWD}:${PWD}/qml"
          tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable "AppDir/usr/bin/${APP_NAME}" \
            --desktop-file "AppDir/usr/share/applications/${APP_NAME}.desktop" \
            --icon-file "AppDir/usr/share/icons/hicolor/scalable/apps/OpenShell.svg" \
            --custom-apprun "tools/OpenShell.AppRun" \
            --plugin qt \
            --output appimage

          generated_appimage="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [ -z "${generated_appimage}" ]; then
            echo "Generated AppImage was not found." >&2
            exit 1
          fi
          mv "${generated_appimage}" "package/${{ matrix.asset_name }}.AppImage"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            package/*.zip
            package/*.AppImage
            package/*.dmg
          if-no-files-found: error

  build-android:
    name: Build OpenShell-android-arm64
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      ANDROID_ABI: arm64-v8a
      ANDROID_PLATFORM: android-35
      ANDROID_NDK_VERSION: 27.0.12077973
      ANDROID_ASSET_NAME: OpenShell-android-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate platform icons
        shell: bash
        run: python scripts/generate-platform-icons.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install Ninja
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Cache Qt Android
        id: cache-qt-android
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-v3-openshell-android-${{ env.QT_VERSION }}-linux_gcc_64-android_arm64_v8a

      - name: Install Qt Android
        if: steps.cache-qt-android.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          python -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 -O "${RUNNER_TEMP}/Qt"
          python -m aqt install-qt linux android "${QT_VERSION}" android_arm64_v8a -O "${RUNNER_TEMP}/Qt"

      - name: Configure Qt Android environment
        shell: bash
        run: |
          qt_root="${RUNNER_TEMP}/Qt/${QT_VERSION}/android_arm64_v8a"
          host_qt_root="${RUNNER_TEMP}/Qt/${QT_VERSION}/gcc_64"
          if [ ! -d "${qt_root}" ]; then
            echo "Qt Android root was not found: ${qt_root}" >&2
            exit 1
          fi
          if [ ! -d "${host_qt_root}" ]; then
            echo "Qt host root was not found: ${host_qt_root}" >&2
            exit 1
          fi
          echo "QT_ANDROID_ROOT=${qt_root}" >> "${GITHUB_ENV}"
          echo "QT_HOST_ROOT=${host_qt_root}" >> "${GITHUB_ENV}"
          echo "${qt_root}/bin" >> "${GITHUB_PATH}"
          echo "${host_qt_root}/bin" >> "${GITHUB_PATH}"

      - name: Configure Android
        shell: bash
        run: |
          set -euo pipefail
          "${QT_ANDROID_ROOT}/bin/qt-cmake" \
            -S . \
            -B build-android-arm64 \
            -G Ninja \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}" \
            -DQT_HOST_PATH="${QT_HOST_ROOT}" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"

      - name: Build Android
        shell: bash
        run: cmake --build build-android-arm64 --config "${BUILD_TYPE}" --parallel

      # CI 用 Release 构建，Qt 的 androiddeployqt 在没传 keystore 时产出的是
      # 未签名 APK，装到设备上会报 "安装包无效"。这里用 GH Secrets 提供的
      # keystore 用 apksigner 重新签一遍。secrets 缺失就让步骤失败而不是
      # 静默产出装不上的包。
      - name: Sign Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is empty; set up the keystore secrets first." >&2
            exit 1
          fi

          keystore="${RUNNER_TEMP}/release.keystore"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${keystore}"

          apk="$(find build-android-arm64/android-build -type f -name 'OpenShell.apk' -print -quit)"
          if [ -z "${apk}" ]; then
            echo "OpenShell.apk not found under build-android-arm64/android-build" >&2
            exit 1
          fi

          apksigner="$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "${apksigner}" ]; then
            echo "apksigner not found under ${ANDROID_SDK_ROOT}/build-tools" >&2
            exit 1
          fi

          "${apksigner}" sign \
            --ks "${keystore}" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            "${apk}"

          "${apksigner}" verify --verbose "${apk}"
          rm -f "${keystore}" "${apk}.idsig"

      - name: Package Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          apk_path="build-android-arm64/android-build/OpenShell.apk"
          if [ ! -f "${apk_path}" ]; then
            apk_path="$(find build-android-arm64/android-build -type f -name '*.apk' -print -quit)"
          fi
          if [ -z "${apk_path}" ] || [ ! -f "${apk_path}" ]; then
            echo "Android APK was not found." >&2
            exit 1
          fi
          cp "${apk_path}" "package/${ANDROID_ASSET_NAME}.apk"

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANDROID_ASSET_NAME }}
          path: package/*.apk
          if-no-files-found: error

  build-ios:
    name: Build OpenShell-ios-${{ matrix.target.name }}
    needs: prepare
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target:
          # Qt 6.x 预编译 iOS kit 是经典 fat：x86_64-simulator + arm64-device。
          # 所以 simulator 必须 x86_64，device 必须 arm64 才能链接通过。
          - name: simulator-x86_64
            sysroot: iphonesimulator
            arch: x86_64
            package: zip
          - name: device-arm64
            sysroot: iphoneos
            arch: arm64
            package: ipa
    env:
      IOS_ASSET_NAME: OpenShell-ios-${{ matrix.target.name }}
      IOS_SYSROOT: ${{ matrix.target.sysroot }}
      IOS_ARCH: ${{ matrix.target.arch }}
      IOS_PACKAGE: ${{ matrix.target.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk "${IOS_SYSROOT}" --show-sdk-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate platform icons
        shell: bash
        run: python scripts/generate-platform-icons.py

      - name: Cache Qt iOS
        id: cache-qt-ios
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-v1-openshell-ios-${{ env.QT_VERSION }}-macos-ios

      - name: Install Qt iOS
        if: steps.cache-qt-ios.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          python -m aqt install-qt mac desktop "${QT_VERSION}" clang_64 -O "${RUNNER_TEMP}/Qt"
          python -m aqt install-qt mac ios "${QT_VERSION}" ios -O "${RUNNER_TEMP}/Qt"

      - name: Configure Qt iOS environment
        shell: bash
        run: |
          ios_qt_root="${RUNNER_TEMP}/Qt/${QT_VERSION}/ios"
          host_qt_root="${RUNNER_TEMP}/Qt/${QT_VERSION}/macos"
          if [ ! -d "${ios_qt_root}" ]; then
            echo "Qt iOS root was not found: ${ios_qt_root}" >&2
            exit 1
          fi
          if [ ! -d "${host_qt_root}" ]; then
            echo "Qt host root was not found: ${host_qt_root}" >&2
            exit 1
          fi
          echo "QT_IOS_ROOT=${ios_qt_root}" >> "${GITHUB_ENV}"
          echo "QT_HOST_ROOT=${host_qt_root}" >> "${GITHUB_ENV}"
          echo "${ios_qt_root}/bin" >> "${GITHUB_PATH}"
          echo "${host_qt_root}/bin" >> "${GITHUB_PATH}"

      - name: Configure iOS
        shell: bash
        run: |
          set -euo pipefail
          # 走单配置 Ninja。多配置生成器（Xcode / Ninja Multi-Config）会把
          # FetchContent 拉的 mbedcrypto 静态库放进配置子目录（Debug-iphonesimulator/
          # 或 Debug/），但 CMakeLists.txt 里给 libssh2 喂的 MBEDCRYPTO_LIBRARY
          # 是写死的无子目录路径，链接期会报 file not found。单配置 Ninja 直接把
          # 产物放在 library/ 下，绕开这条硬编码。
          "${QT_IOS_ROOT}/bin/qt-cmake" \
            -S . \
            -B build-ios \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DQT_HOST_PATH="${QT_HOST_ROOT}" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${IOS_SYSROOT}" \
            -DCMAKE_OSX_ARCHITECTURES="${IOS_ARCH}"

      - name: Build iOS app
        shell: bash
        run: |
          set -euo pipefail
          # 注意：qt-cmake 在 6.10 等版本只支持配置期参数，不接 --build。
          # 直接用 cmake --build 走 ninja。
          cmake --build build-ios

      - name: Package iOS artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          app_path="$(find build-ios -type d -name "${APP_NAME}.app" -print -quit)"
          if [ -z "${app_path}" ]; then
            echo "iOS app bundle was not found." >&2
            exit 1
          fi
          # Ad-hoc 签名。simulator 不严格需要，但保持一致；device 上的 .ipa
          # 拿这个伪签只能跑在越狱设备 / TrollStore / AltStore（本地重签）这类
          # 场景，正常 iPhone 安装会被系统拒绝。
          codesign --force --deep --sign - "${app_path}"
          case "${IOS_PACKAGE}" in
            ipa)
              staging="$(mktemp -d)"
              mkdir -p "${staging}/Payload"
              cp -R "${app_path}" "${staging}/Payload/"
              (cd "${staging}" && zip -qry "${GITHUB_WORKSPACE}/package/${IOS_ASSET_NAME}.ipa" Payload)
              ;;
            zip)
              ditto -c -k --sequesterRsrc --keepParent "${app_path}" "package/${IOS_ASSET_NAME}.zip"
              ;;
            *)
              echo "Unknown IOS_PACKAGE=${IOS_PACKAGE}" >&2
              exit 1
              ;;
          esac

      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IOS_ASSET_NAME }}
          path: |
            package/*.zip
            package/*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - build
      - build-android
      - build-ios
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update tag
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "Tag ${TAG_NAME} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail
          ls -la dist

          mapfile -t assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          notes_file="$(mktemp)"
          previous_tag="$(git tag --sort=-creatordate | grep -v "^${TAG_NAME}$" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            change_range="${previous_tag}..HEAD"
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous_tag}...${TAG_NAME}"
          else
            change_range="HEAD"
            compare_url=""
          fi

          {
            echo "OpenShell ${TAG_NAME}"
            echo
            echo "Changes:"
            if git log --pretty='format:- %s (%h)' "${change_range}" | grep -q .; then
              git log --pretty='format:- %s (%h)' "${change_range}"
              echo
            else
              echo "- No commit changes detected."
            fi
            if [ -n "${compare_url}" ]; then
              echo
              echo "Full changelog: ${compare_url}"
            fi
            echo
            echo "Assets:"
            for asset in "${assets[@]}"; do
              echo "- ${asset}"
            done
          } > "${notes_file}"

          prerelease_flag=()
          if [ "${PRERELEASE}" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --notes-file "${notes_file}" "${prerelease_flag[@]}"
            gh release upload "${TAG_NAME}" dist/* --clobber
          else
            gh release create "${TAG_NAME}" dist/* \
              --title "OpenShell ${TAG_NAME}" \
              --notes-file "${notes_file}" \
              "${prerelease_flag[@]}"
          fi
